name: render-demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render README demo (GIF + MP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Render frames
        run: python scripts/render-demo.py /tmp/frames
      - name: Encode GIF and MP4
        run: |
          mkdir -p assets
          ffmpeg -y -framerate 30 -i /tmp/frames/f%05d.png -vf "fps=8,scale=760:-1:flags=lanczos,palettegen=max_colors=32:stats_mode=diff" /tmp/pal.png
          ffmpeg -y -framerate 30 -i /tmp/frames/f%05d.png -i /tmp/pal.png -lavfi "fps=8,scale=760:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=none:diff_mode=rectangle" assets/demo.gif
          ffmpeg -y -framerate 30 -i /tmp/frames/f%05d.png -vf scale=960:540 -c:v libx264 -crf 30 -preset veryslow -tune animation -pix_fmt yuv420p -movflags +faststart assets/demo.mp4
      - name: Commit demo assets (one commit per file)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo.gif
          git commit -m "Add README demo GIF (rendered by render-demo workflow)" || echo "GIF unchanged"
          git add assets/demo.mp4
          git commit -m "Add README demo MP4 (rendered by render-demo workflow)" || echo "MP4 unchanged"
          git push
