# markdownlint-cli2 configuration
config:
  default: true
  # Allow long lines (checklists and tables run long)
  MD013: false
  # Allow inline HTML (README embeds a <video> tag)
  MD033: false
  # Allow duplicate headings in different sections (templates reuse names)
  MD024:
    siblings_only: true
  # First line need not be a top-level heading (badges/blockquotes may precede)
  MD041: false
  # Ordered-list numbering style is not enforced
  MD029: false
  # Compact checklist style: headings and lists may sit directly next to each other
  MD022: false
  MD032: false
  # Templates intentionally leave blank space for people to fill in
  MD012: false
  # Templates use emphasized placeholder lines like *(repeat for each finding)*
  MD036: false
globs:
  - "**/*.md"
ignores:
  - "LICENSE"
  - "node_modules"
